[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "subscope"
version = "0.1.0"
description = "Fast passive subdomain enumeration with optional DNS validation."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Codex" }]
license = { text = "MIT" }
dependencies = []

[project.scripts]
subscope = "cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["cli", "engine", "http_client", "models", "normalize", "output", "resolver", "sources"]
